name: purchase-agent-mcp-tests

services:
  postgres-test:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: purchase_mcp_test
      POSTGRES_USER: mcp_test
      POSTGRES_PASSWORD: test_only_password
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 20
    networks: [test-network]

  mcp-tests:
    build:
      context: .
      dockerfile: mcp-server/Dockerfile.test
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://mcp_test:test_only_password@postgres-test:5432/purchase_mcp_test
    depends_on:
      postgres-test:
        condition: service_healthy
    networks: [test-network]

networks:
  test-network:
    internal: true
