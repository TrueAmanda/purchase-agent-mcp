[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "purchase-storage"
version = "0.1.0"
description = "Shared persistence contracts for the purchase API and MCP server"
requires-python = ">=3.11"
dependencies = ["SQLAlchemy==2.0.55", "psycopg[binary]==3.3.6"]

[tool.setuptools.packages.find]
include = ["purchase_storage*"]

[tool.setuptools.package-data]
purchase_storage = ["migrations/*.sql"]
