name: purchase-agent-mcp

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-purchase_agent}
      POSTGRES_USER: ${POSTGRES_USER:-purchase_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-purchase_local_only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  mcp-server:
    build:
      context: .
      dockerfile: mcp-server/Dockerfile
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8001
      PRODUCT_API_TIMEOUT_SECONDS: ${PRODUCT_API_TIMEOUT_SECONDS:-10}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-purchase_agent}
      POSTGRES_USER: ${POSTGRES_USER:-purchase_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-purchase_local_only}
      DB_STARTUP_ATTEMPTS: ${DB_STARTUP_ATTEMPTS:-30}
      DB_STARTUP_INTERVAL_SECONDS: ${DB_STARTUP_INTERVAL_SECONDS:-2}
    ports:
      - "127.0.0.1:${MCP_PORT:-8001}:8001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 90s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-purchase_agent}
      POSTGRES_USER: ${POSTGRES_USER:-purchase_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-purchase_local_only}
      DB_STARTUP_ATTEMPTS: ${DB_STARTUP_ATTEMPTS:-30}
      DB_STARTUP_INTERVAL_SECONDS: ${DB_STARTUP_INTERVAL_SECONDS:-2}
      MCP_SERVER_URL: http://mcp-server:8001/mcp
      MCP_TIMEOUT_SECONDS: ${MCP_TIMEOUT_SECONDS:-15}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_TIMEOUT_SECONDS: ${OPENROUTER_TIMEOUT_SECONDS:-30}
      OPENROUTER_TEMPERATURE: ${OPENROUTER_TEMPERATURE:-0}
      OPENROUTER_MAX_TOKENS: ${OPENROUTER_MAX_TOKENS:-2048}
      AGENT_MAX_ITERATIONS: ${AGENT_MAX_ITERATIONS:-8}
      AGENT_MAX_TOOL_CALLS_PER_ITERATION: ${AGENT_MAX_TOOL_CALLS_PER_ITERATION:-8}
      AGENT_TOOL_TIMEOUT_SECONDS: ${AGENT_TOOL_TIMEOUT_SECONDS:-15}
      AGENT_RUN_TIMEOUT_SECONDS: ${AGENT_RUN_TIMEOUT_SECONDS:-120}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mcp-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 5s
      timeout: 6s
      retries: 10
      start_period: 90s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres-data:
